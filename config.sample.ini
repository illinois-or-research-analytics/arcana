; ARCANA sample configuration.
; Copy to config.ini, replace the /path/to/... entries with your own input files, and run:
;   ./build/bin/abm --config ./config.ini --db-path <fast local directory>
; The values below are those of the runs in PROVENANCE.md (one seed set, 40 cycles at 10% growth). They are an
; example, not a recommended default: the settings need to be tuned for each seed set and each set of running conditions.
; Inline comments start with ';'.
; The config parser reads at most 200 characters per line (INI_MAX_LINE in the bundled inih). A longer line, such as a
; long path followed by an inline comment, fails with "parse error on line N" and the run exits at startup. Put long
; comments on their own line, as for community_assignment below.

[Environment]
nodelist=/path/to/seed_nodelist.csv ; seed papers: node_id,year
edgelist=/path/to/seed_edgelist.csv ; seed citations: source,target
community_assignment=/path/to/seed_field_labels.csv
; community label per seed paper: node_id,cluster_id (used by the cluster route, see theta). Field labels or a clustering such as Leiden CPM.
recency_table=/path/to/recency_table.csv ; diff,count: number of citations at each age in years; age 0 is ignored
out_degree_bag=/path/to/out_degree_bag.csv ; empirical out-degrees to draw from for new papers: node_id,out_degree
growth_rate=0.1 ; floating point value e.g., 0.03 for 3%
num_cycles=40 ; integer value e.g., 30 for a 30-year simulation
; recency_bins is still read and validated, but it is not used when unbinned_age_sampling=true
recency_bins=1,2,3,4,5,10,15,20,25,30,35,40,45,50
planted_nodes=
start_from_checkpoint=false ;

[Agent]
alpha=-1 ; share of the citation quota to distance-1 candidates. -1 draws it at random for each agent.
; Optional bounds for the random alpha (only with alpha=-1). Default: uniform on [0, 1], expected value 0.5.
; With the cluster route on (theta), the within-cluster citation fraction is about the mean alpha, so
; minimum_alpha=0.55 and maximum_alpha=0.95 emphasizes intra-cluster citations. Either bound may be given alone.
;minimum_alpha=0.55
;maximum_alpha=0.95
use_alpha=true ; boolean value e.g., true or false
theta=50 ; minimum cluster size for the cluster route. A value above the largest cluster (e.g., 1000000) turns the cluster route off.
same_year_citations=0.12 ; floating point value e.g., 0.12 for 12%
fully_random_citations=0.05 ; floating point value e.g., 0.05 for 5%
; Fixed or fully random weights (CantataS behavior). -1 draws all four at random. Ignored when the *_weight_mean values below are set.
preferential_weight=-1
fitness_weight=-1
num_authors_weight=-1
author_reputation_weight=-1
fitness_value_min=1 ; minimum fitness value (inclusive)
fitness_value_max=1000 ; maximum fitness value (inclusive)
fitness_lag_duration_min=0 ;
fitness_lag_duration_max=0 ;
fitness_peak_duration_min=1000 ;
fitness_peak_duration_max=1000 ;
neighborhood_sample=10000 ; maximum number of nodes to sample from each neighborhood when the cluster route is not used
in_degree_threshold=90
fitness_threshold=50
recency_threshold=10
non_random_generator_probability=0 ; 0 draws the generator uniformly from all papers
author_max_lifetime=30
cartel_outdegree_proportion=0.50
clonal_cartel_agent_file=
null_cartel=true ;
num_authors_bag=/path/to/num_authors_bag.csv ; empirical author counts to draw from for new papers: pubmed_id,author_count

; --- ARCANA options (all off by default) ---
unbinned_age_sampling=true ; draw each citation's age from recency_table per year, no bins
; Expected values of the four agent weights (preferential attachment, fitness, author count, author reputation).
; Each agent draws its weights from a Dirichlet distribution with these means (rescaled to sum to 1).
; A mean of 0 keeps that weight at 0. Remove these five lines to use the weights set above.
pa_weight_mean=0.05
fit_weight_mean=0.95
na_weight_mean=0
ar_weight_mean=0
weight_concentration=50 ; larger = weights stay closer to their means (50: pa weight std. dev. about 0.03 around 0.05)

; --- Experimental options kept for provenance (no benefit shown; leave off) ---
; max_citable_age=10 ; papers older than this many years cannot be cited; piles citations on the oldest allowed age
; age_damping_start=10 ; damp the in-degree score for papers older than this (no measurable effect)
; age_damping_tau=10
; age_damping_min_exponent=0
; neighborhood_recency_lambda=-1 ; bias neighborhood down-sampling towards recent papers (<=0: uniform); never run
; neighborhood_prepool_factor=1

[General]
output_file=./output/edgelist.csv ; output csv edgelist
auxiliary_information_file=./output/nodelist.csv ; output auxiliary information file
log_file=./output/log.txt ; output log file
num_processors=32 ; integer valued maximum parallelism allowed
log_level=1 ; 0, 1, and 2 for silent, info, and verbose
storage_backend=ladybug ; ladybug (out-of-core mmap) or legacy (in-memory)
db_path=./ladybug_data ; directory for LadyBugDB persistent storage; use fast node-local storage
use_distributed=false ; true (MPI) reproduced single-node results for theta=50 in two 4-node replicates
ghost_hub_threshold=1000 ; in-degree threshold to replicate ghost hub cells
wall_clock_limit=0 ; Slurm wall-clock limit in seconds (0 = disabled)

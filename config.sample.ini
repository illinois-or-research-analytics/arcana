[Environment]
nodelist=/path/to/seed_nodelist.csv
edgelist=/path/to/seed_edgelist.csv
community_assignment=/path/to/seed_field_labels.csv
recency_table=/path/to/recency_table.csv
out_degree_bag=/path/to/out_degree_bag.csv
growth_rate=0.1
num_cycles=40
recency_bins=1,2,3,4,5,10,15,20,25,30,35,40,45,50
planted_nodes=
start_from_checkpoint=false

[Agent]
alpha=-1
use_alpha=true
theta=50
same_year_citations=0.12
fully_random_citations=0.05
preferential_weight=-1
fitness_weight=-1
num_authors_weight=-1
author_reputation_weight=-1
fitness_value_min=1
fitness_value_max=1000
fitness_lag_duration_min=0
fitness_lag_duration_max=0
fitness_peak_duration_min=1000
fitness_peak_duration_max=1000
neighborhood_sample=10000
in_degree_threshold=90
fitness_threshold=50
recency_threshold=10
non_random_generator_probability=0
author_max_lifetime=30
cartel_outdegree_proportion=0.50
clonal_cartel_agent_file=
null_cartel=true
num_authors_bag=/path/to/num_authors_bag.csv

unbinned_age_sampling=true
pa_weight_mean=0.05
fit_weight_mean=0.95
na_weight_mean=0
ar_weight_mean=0
weight_concentration=50

[General]
output_file=./output/edgelist.csv
auxiliary_information_file=./output/nodelist.csv
log_file=./output/log.txt
num_processors=32
log_level=1
storage_backend=ladybug
db_path=./ladybug_data
use_distributed=false
ghost_hub_threshold=1000
wall_clock_limit=0
